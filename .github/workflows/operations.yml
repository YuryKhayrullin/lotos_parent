name: Operations monitor
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: operations-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (vars.OPS_MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore previous monitor state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/monitor
          id=""
          # A skipped/aborted run may have no artifact: look back for the last real state.
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/operations.yml/runs?branch=main&status=completed&per_page=30" --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id'); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "operations-state" and .expired == false) | .id' | head -1)
            if [ -n "$id" ]; then break; fi
          done
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/monitor-state.zip"
            unzip -j "$RUNNER_TEMP/monitor-state.zip" monitor-state.json -d .artifacts/monitor
          fi
      - name: Check services
        run: node scripts/operations-monitor.mjs
      - name: Persist monitor state even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: operations-state
          path: .artifacts/monitor/monitor-state.json
          retention-days: 7
          if-no-files-found: error
