name: Connectivity diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectivity-diagnosis
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check public HTTPS endpoints using normal DNS
        run: node scripts/connectivity-probe.mjs
      - name: Save sanitized timing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: connectivity-timings
          path: .artifacts/connectivity/timings.json
          retention-days: 7
          if-no-files-found: error
